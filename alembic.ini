# RAGEval Studio - Alembic
# Migration URL: ALEMBIC_DATABASE_URL first, falls back to DATABASE_URL (see alembic/env.py)

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# target_metadata injected by env.py (app.models.Base.metadata)

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
