[project]
name = "rageval-studio"
version = "0.1.0"
description = "RAGEval Studio — RAG Quality Evaluation & Diagnosis Platform"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.30",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic~=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings~=2.4",
    "pyyaml~=6.0",
    "httpx~=0.27",
    "python-dotenv~=1.0",
    "reportlab~=4.2",  # read-only report export (PDF); ships CJK CID font metrics
]

[project.optional-dependencies]
# RAGAS 引擎（M2/T-08）。版本锁定并记录进 metric_version（Spec：RAGAS version locked）。
# langchain-community 锁 0.3.x：ragas 0.4.3 按 0.3.x API 顶层导入 chat_models.vertexai。
eval = [
    "ragas==0.4.3",
    "langchain-community==0.3.31",
]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.23",
    "ruff~=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: real PostgreSQL integration tests (require TEST_DATABASE_URL; skipped honestly when unset)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",  # FastAPI idiom: Depends()/Query() in parameter defaults
]
