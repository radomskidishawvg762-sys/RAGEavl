# RAGEval Studio — Docker Compose（MVP，仅应用容器）
#
# 数据库不在本文件中。
# 数据库使用预配置的 Supabase Cloud PostgreSQL，通过 DATABASE_URL 连接。
#
# 已移除（本地 PostgreSQL → Supabase Cloud 迁移）：
#   ✗ db service（postgres:xx 镜像）
#   ✗ pgdata 数据卷
#   ✗ 5432:5432 端口映射
#   ✗ depends_on: db
#   ✗ wait-for-postgres 等待脚本
#
# 数据库不可达时的行为：应用依赖连接重试 + /api/health 健康检查报错，
# 而不是等待本地 db 容器就绪。
#
# 本文件位于 docker/ 子目录：相对路径均以本文件所在目录为基准，
# 仓库根的内容用 ../ 引用；构建上下文 context 指向仓库根（..）。
#
# 详见 docs/deployment/SUPABASE_CLOUD.md

# 固定项目名（否则默认取 compose 文件所在目录名 "docker"）
name: rageval-studio

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rageval-app
    ports:
      - "8000:8000"
    env_file:
      # 本地实际配置，不提交 Git
      - ../.env.local
    volumes:
      # 三层配置（system / domains / evaluations）
      - ../config:/app/config:ro
      # 报告与数据集导出（MVP 继续本地挂载，不用 Supabase Storage）
      - ../exports:/app/exports
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim ships no curl, so the old ["CMD","curl",...] probe exited
      # 127 and the container reported unhealthy forever. urlopen raises on any
      # non-2xx, which matches curl -f semantics (503 from a down database = unhealthy).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
