name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12 / PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rageval
          # Disposable CI-only database credentials; never production credentials.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rageval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rageval -d rageval_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rageval:ci-only-password@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://rageval:ci-only-password@127.0.0.1:5432/rageval_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://rageval:ci-only-password@127.0.0.1:5432/rageval_test
      RAGEVAL_ENV: test
      JUDGE_PROVIDER: ''
      JUDGE_MODEL: ''
      JUDGE_MODEL_VERSION: ''
      JUDGE_API_KEY: ''
      JUDGE_BASE_URL: ''
      JUDGE_EXTRA_HEADERS: ''
      OPENAI_API_KEY: ''
      RAG_INPUT_URL: ''
      RAGAS_DO_NOT_TRACK: 'true'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev,eval]"
      - name: Ruff
        run: python -m ruff check .
      - name: Migrate dedicated test database
        # Fail here if PostgreSQL is unavailable instead of silently skipping it.
        run: python -m alembic upgrade head
      - name: Full pytest suite
        run: python -m pytest -q -ra --junitxml=exports/ci/pytest.xml
      - name: Verify skipped tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("exports/ci/pytest.xml").getroot()
          skipped = {
              f"{case.get('classname')}::{case.get('name')}"
              for case in root.iter("testcase") if case.find("skipped") is not None
          }
          expected = {"tests.test_judge_provider::test_golden_smoke_single_record"}
          print("Skipped tests:", sorted(skipped))
          if skipped != expected:
              raise SystemExit("Expected only the existing real-Judge smoke test to skip")
          PY

  frontend:
    name: Frontend (Node 24 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build
